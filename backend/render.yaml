services:
  - type: web
    name: clypfetch-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Lock this to your Vercel URL in production, e.g.
      # https://clypfetch.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"
