# fly.toml — deploy with:  fly launch --no-deploy  (then edit) ->  fly deploy
app = "clypfetch-api"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  ALLOWED_ORIGINS = "*"   # lock to your Vercel URL in production

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
